/* Semester tracker design v3 — loads after styles.css. Specialty-agnostic: a new specialty only sets
   the brand tokens under :root[data-specialty="..."] (see README).
   Idea: a clinical chart. Ink carries structure, surgical red is reserved for action only. */
:root{
  --brand:#c91f33;--brand-strong:#a91527;--brand-soft:#fff2f4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;

.title,.card h2,.card h3,.hero h1,.hero h2{font-family:var(--serif)!important;font-weight:700!important;letter-spacing:-.02em!important;text-wrap:balance}
.title{font-size:clamp(30px,6.4vw,44px)!important;line-height:1.05!important;margin:8px 0 8px!important}
.field label,.nav-title,.checks label,.eyebrow,.modal-section,.data-table td::before,thead th{text-transform:none!important;letter-spacing:0!important}
.eyebrow{font-size:var(--fs-sm)!important;font-weight:650!important;color:var(--muted)!important;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.field label{font-size:var(--fs-sm);font-weight:650;color:var(--text)}
.checks label{font-size:var(--fs-sm);font-weight:560;min-height:40px;padding:8px 12px}
.modal-section{font-size:var(--fs-md)!important;font-weight:750;color:var(--ink)!important}
input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important;min-height:var(--tap);border-radius:var(--r-ctl)!important}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--brand)}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.btn{border-radius:var(--r-ctl)!important;min-height:var(--tap);font-size:var(--fs-sm)!important;font-weight:650;padding:0 16px}
.btn.primary{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.btn.icon-btn{padding:0;width:var(--tap)}
.topbar{height:64px;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--surface) 88%,transparent)}
.tag{font-size:var(--fs-xs);padding:3px 9px;border-radius:999px;font-weight:650}

/* ---------- the one bold element: ink hero ---------- */
.hero{background:var(--panel)!important;color:var(--panel-text)!important;border:0!important;border-radius:22px!important;padding:clamp(22px,4vw,36px)!important}

.hero-actions{gap:10px!important;margin-top:22px!important}

/* ---------- stats become one ledger strip ---------- */
.cols4{gap:0!important;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}

.sidebar{width:248px!important;padding:22px 14px!important}

@media(max-width:720px){

  .modal{align-items:flex-end;padding:0!important}

  .modal-body{overflow-y:auto;flex:1}

  .modal-actions .btn{flex:1}
}

/* ---------- legibility floor: nothing under 12px, anywhere ---------- */
